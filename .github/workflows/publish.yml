name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to retry
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.18.0

      - name: Stamp package version from tag
        id: package
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          npm pkg set "version=$VERSION" --prefix packages/bundle
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Test packed consumer install
        run: bun run test:package

      - name: Publish package
        working-directory: packages/bundle
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "verify-repo@$VERSION" version >/dev/null 2>&1; then
            echo "verify-repo@$VERSION is already published"
          else
            npm publish --access public
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set +e
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"
          release_status=$?
          set -e

          if [ "$release_status" -eq 0 ]; then
            if [ "$(jq -r '.draft or .prerelease' <<<"$release_json")" = true ]; then
              gh api "repos/$GITHUB_REPOSITORY/releases/$(jq -r .id <<<"$release_json")" \
                --method PATCH \
                -F draft=false \
                -F prerelease=false \
                -f make_latest=true
            else
              echo "::notice::Release $TAG is already published."
            fi
          elif grep -q 'HTTP 404' <<<"$release_json"; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          else
            printf '%s\n' "$release_json" >&2
            exit "$release_status"
          fi
